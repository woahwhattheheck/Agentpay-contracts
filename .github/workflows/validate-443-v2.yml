name: Validate 443 overlay v2

on:
  push:
    branches:
      - validation/443-settlement-version-v2-20261005

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply inherited-main compile overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          events = Path("contracts/escrow/src/events.rs")
          text = events.read_text()
          prefix = "use soroban_sdk::{symbol_short, Symbol};\n\n"
          if not text.startswith(prefix):
              events.write_text(prefix + text)

          lib = Path("contracts/escrow/src/lib.rs")
          text = lib.read_text()
          if "#[allow(dead_code)]\nmod events;" not in text:
              text = text.replace("mod events;", "#[allow(dead_code)]\nmod events;", 1)
              lib.write_text(text)

          tests = Path("contracts/escrow/src/test.rs")
          text = tests.read_text()
          replacement = '#[path = "regression_test.rs"]\nmod regression_test;'
          if replacement not in text:
              text = text.replace("mod regression_test;", replacement, 1)
              tests.write_text(text)

          regression = Path("contracts/escrow/src/regression_test.rs")
          text = regression.read_text()
          if not text.startswith("use super::*;"):
              text = "use super::*;\n\n" + text
          text = text.replace("topics, &expected_topics,", "topics, expected_topics,", 1)
          regression.write_text(text)
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.76
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format workspace
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: WASM build
        run: cargo build --target wasm32-unknown-unknown --release
