name: Validate 443 overlay

on:
  push:
    branches:
      - validation/443-settlement-version-20261005

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.76
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Apply current-main compile overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          events = Path("contracts/escrow/src/events.rs")
          text = events.read_text()
          prefix = "use soroban_sdk::{symbol_short, Symbol};\n\n"
          if not text.startswith(prefix):
              events.write_text(prefix + text)

          tests = Path("contracts/escrow/src/test.rs")
          text = tests.read_text()
          marker = "mod regression_test;"
          replacement = '#[path = "regression_test.rs"]\nmod regression_test;'
          if replacement not in text:
              text = text.replace(marker, replacement, 1)
              tests.write_text(text)
          PY

      - name: Format workspace
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: WASM build
        run: cargo build --target wasm32-unknown-unknown --release
